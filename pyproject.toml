[tool.isort]
profile = "black"

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-ui"
version = "0.17.2"
description = "Build Nice User Interfaces In The Terminal"
readme = "README.md"
authors = [{name = "Dimitri Merejkowsky", email = "dimitri@dmerej.info"}]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.7"
dependencies = [
    "colorama>=0.4.1",
    "tabulate>=0.8.3", 
    "unidecode>=1.0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.3",
    "flake8>=5.0",
    "flake8-bugbear>=22.7",
    "flake8-comprehensions>=3.10.0",
    "pep8-naming>=0.13.1",
    "isort>=5.7.0",
    "mypy>=0.960",
]

[project.urls]
Homepage = "https://github.com/your-tools/python-cli-ui"
Documentation = "https://your-tools.github.io/python-cli-ui/"
Repository = "https://github.com/your-tools/python-cli-ui.git"
Changelog = "https://your-tools.github.io/python-cli-ui/changelog.html"
Issues = "https://github.com/your-tools/python-cli-ui/issues"

[project.scripts]
cli-ui = "cli_ui:main"